<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.css">
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #f2efe9;
      --muted: #8a8780;
      --accent: #ff5a1f;
      --line: rgba(242, 239, 233, 0.12);
      --display: 'Instrument Serif', Georgia, serif;
      --body: 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font-family: var(--body); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }

    .nav { position: fixed; inset: 0 0 auto; display: flex; justify-content: space-between; padding: 20px 4vw; z-index: 10; mix-blend-mode: difference; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }

    .hero { position: relative; min-height: 100vh; display: grid; place-items: center; overflow: hidden; }
    .hero__inner { position: relative; z-index: 1; text-align: center; padding: 0 4vw; }
    .hero__title { font-family: var(--display); font-weight: 400; font-size: clamp(64px, 16vw, 260px); line-height: .85; letter-spacing: -.03em; }
    .hero__sub { margin-top: 24px; font-size: clamp(12px, 1.2vw, 15px); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 60%, var(--bg)); pointer-events: none; }

    .section { padding: 18vh 4vw; border-top: 1px solid var(--line); }
    .eyebrow { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 32px; }
    .statement { font-family: var(--display); font-size: clamp(36px, 6vw, 96px); line-height: 1; max-width: 16ch; }
    .statement em { color: var(--accent); }

    .pin { height: 100vh; display: grid; place-items: center; overflow: hidden; }
    .pin__media { width: 40vw; aspect-ratio: 4 / 5; border-radius: 4px; overflow: hidden; background: linear-gradient(135deg, #2a2420, #120f0d); }

    .work { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 4vw; }
    .card { aspect-ratio: 4 / 5; border-radius: 4px; overflow: hidden; background: #1a1714; position: relative; }
    .card span { position: absolute; left: 16px; bottom: 16px; font-size: 13px; }

    .marquee { overflow: hidden; white-space: nowrap; padding: 6vh 0; border-top: 1px solid var(--line); }
    .marquee__track { display: inline-flex; gap: 4vw; font-family: var(--display); font-size: clamp(48px, 10vw, 160px); }

    .footer { padding: 18vh 4vw 6vh; }
    .footer__cta { font-family: var(--display); font-size: clamp(56px, 14vw, 220px); line-height: .9; }
    .footer__meta { display: flex; justify-content: space-between; margin-top: 10vh; color: var(--muted); font-size: 13px; }

    @media (max-width: 640px) { .pin__media { width: 80vw; } }
    @media (prefers-reduced-motion: reduce) { .marquee__track { transform: none !important; } }
  </style>
</head>
<body>
  <nav class="nav"><a href="#top">Studio®</a><a href="#work">Work</a><a href="#contact">Contact</a></nav>

  <header class="hero" id="top">
    <div class="hero__inner">
      <h1 class="hero__title" data-split>studio</h1>
      <p class="hero__sub" data-fade>Creative studio &amp; visual production</p>
    </div>
  </header>

  <section class="section">
    <p class="eyebrow">About</p>
    <p class="statement" data-split-lines>We make work that feels <em>alive</em> on every scroll.</p>
  </section>

  <section class="pin" data-pin>
    <div class="pin__media" data-pin-media></div>
  </section>

  <section class="section" id="work">
    <p class="eyebrow">Selected work</p>
    <div class="work">
      <a class="card" href="#" data-reveal><span>Project 01</span></a>
      <a class="card" href="#" data-reveal><span>Project 02</span></a>
      <a class="card" href="#" data-reveal><span>Project 03</span></a>
    </div>
  </section>

  <div class="marquee" aria-hidden="true">
    <div class="marquee__track" data-marquee>
      <span>Brand · Film · Web · Motion ·</span><span>Brand · Film · Web · Motion ·</span>
    </div>
  </div>

  <footer class="footer" id="contact">
    <a class="footer__cta" href="mailto:hello@example.com" data-split>Let's talk</a>
    <div class="footer__meta"><span>© Studio</span><span>Instagram · LinkedIn</span></div>
  </footer>

  <!-- Libraries: three r134 for Vanta, GSAP 3.15 (all plugins free), Lenis 1.3.26 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.fog.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger, SplitText);
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // 1. Smooth scroll: Lenis driven by GSAP's ticker (one frame loop)
    const lenis = new Lenis({ anchors: { offset: -60 } });
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add((time) => lenis.raf(time * 1000));
    gsap.ticker.lagSmoothing(0);

    // 2. Living hero background (desktop + motion allowed only)
    let vanta = null;
    if (!reduceMotion && window.innerWidth > 640 && window.VANTA) {
      vanta = VANTA.FOG({
        el: '.hero',
        mouseControls: true, touchControls: true, gyroControls: false,
        highlightColor: 0x6b5a4a, midtoneColor: 0x2a211b, lowlightColor: 0x0f0c0a, baseColor: 0x0a0a0a,
        blurFactor: 0.7, speed: 0.6, zoom: 1,
      });
    }

    // 3. Motion, with a reduced-motion branch
    const mm = gsap.matchMedia();
    mm.add('(prefers-reduced-motion: no-preference)', () => {
      document.fonts.ready.then(() => {
        // Intro: split headline
        document.querySelectorAll('[data-split]').forEach((el) => {
          const split = SplitText.create(el, { type: 'chars', mask: 'chars' });
          gsap.from(split.chars, {
            yPercent: 110, duration: 1.1, ease: 'expo.out', stagger: 0.04,
            scrollTrigger: el.closest('.hero') ? undefined : { trigger: el, start: 'top 85%' },
          });
        });
        // Statements: line-by-line reveal on scroll
        document.querySelectorAll('[data-split-lines]').forEach((el) => {
          const split = SplitText.create(el, { type: 'lines', mask: 'lines' });
          gsap.from(split.lines, {
            yPercent: 100, duration: 1, ease: 'power4.out', stagger: 0.08,
            scrollTrigger: { trigger: el, start: 'top 80%' },
          });
        });
        ScrollTrigger.refresh();
      });

      gsap.from('[data-fade]', { autoAlpha: 0, y: 16, duration: 1, delay: 0.6, ease: 'power2.out' });

      // Pinned media scaling to full screen
      gsap.fromTo('[data-pin-media]', { scale: 1, borderRadius: 4 }, {
        scale: () => Math.max(innerWidth / document.querySelector('[data-pin-media]').offsetWidth, innerHeight / document.querySelector('[data-pin-media]').offsetHeight),
        borderRadius: 0, ease: 'none',
        scrollTrigger: { trigger: '[data-pin]', start: 'top top', end: '+=120%', scrub: true, pin: true, invalidateOnRefresh: true },
      });

      // Cards reveal in batches
      ScrollTrigger.batch('[data-reveal]', {
        start: 'top 90%',
        onEnter: (els) => gsap.from(els, { y: 60, autoAlpha: 0, duration: 1, ease: 'power3.out', stagger: 0.1 }),
        once: true,
      });

      // Marquee whose speed follows scroll velocity
      const track = document.querySelector('[data-marquee]');
      const loop = gsap.to(track, { xPercent: -50, duration: 20, ease: 'none', repeat: -1 });
      lenis.on('scroll', ({ velocity }) => {
        gsap.to(loop, { timeScale: 1 + Math.min(Math.abs(velocity) / 10, 4), duration: 0.3, overwrite: true });
      });
    });
  </script>
</body>
</html>
