<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover Crop Check</title>
<!--
  Approximate LinkedIn top-card layouts for checking the cover's crop, legibility
  and profile-photo overlap. This is NOT LinkedIn's interface: geometry is measured
  from typical layouts (desktop card 804 px wide, 152 px photo; mobile 390 px wide,
  104 px photo) and LinkedIn says the image "may change based on the size of your
  web browser window and screen resolution". ?v=desktop | mobile | mobile-crop
-->
<style>
  @font-face{font-family:"Public Sans";font-weight:400;src:url(../banner/fonts/public-sans-latin-400-normal.woff2)}
  @font-face{font-family:"Public Sans";font-weight:600;src:url(../banner/fonts/public-sans-latin-600-normal.woff2)}
  :root{--bg:#F4F2EE;--card:#FFFFFF;--ink:#1D1D1D;--muted:#666;--line:#E0DFDC}
  body{margin:0;background:var(--bg);font-family:"Public Sans",system-ui,sans-serif;color:var(--ink)}
  .card{background:var(--card);border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line);position:relative}
  .cover{width:100%;display:block;background:#101918 url(../vish-linkedin-cover-1584x396.png) center/cover no-repeat}
  .photo{position:absolute;border-radius:50%;border:4px solid #fff;background:#ccc url(vish.jpg) center 18%/cover;box-sizing:border-box}
  .meta{padding:0 24px 20px}
  .name{font-weight:600;margin:0}
  .head{margin:4px 0 0;line-height:1.35}
  .loc{color:var(--muted);margin:6px 0 0}
  .btns{display:flex;gap:8px;margin-top:12px}
  .btn{border-radius:999px;padding:6px 16px;font-weight:600;font-size:15px;border:1px solid #0A66C2;color:#0A66C2}
  .btn.p{background:#0A66C2;color:#fff}
  .tag{font:600 12px "Public Sans";color:#8a5f06;padding:8px 0 0}
  /* desktop */
  .d{width:804px;margin:24px}
  .d .cover{height:201px}
  .d .photo{width:152px;height:152px;left:24px;top:89px}
  .d .meta{padding-top:68px}
  .d .name{font-size:24px} .d .head{font-size:16px} .d .loc{font-size:14px}
  /* mobile */
  .m{width:390px;margin:16px}
  .m .cover{height:98px}
  .m.crop .cover{height:130px}
  .m .photo{width:104px;height:104px;left:16px;top:38px}
  .m.crop .photo{top:70px}
  .m .meta{padding:52px 16px 16px}
  .m .name{font-size:20px} .m .head{font-size:14px} .m .loc{font-size:13px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'desktop';
const HEADLINE = 'Influencer marketing &amp; account lead | I run creator campaigns from brief to report for brands like HUL, Philips and Tata | Building marketing tools at Build with Vish';
const cls = v==='desktop' ? 'card d' : v==='mobile' ? 'card m' : 'card m crop';
document.getElementById('root').innerHTML = `
  <div class="${cls}">
    <div class="cover"></div>
    <div class="photo"></div>
    <div class="meta">
      <p class="name">Vishwajeet Kumbhar</p>
      <p class="head">${HEADLINE}</p>
      <p class="loc">Offenburg, Baden-Württemberg, Germany</p>
      <div class="btns"><span class="btn p">Open to</span><span class="btn">Add section</span></div>
    </div>
  </div>`;
</script>
</body>
</html>
